name: Career workflow checks
on:
  push:
    branches: [main, 'improvements/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Require the disposable Postgres service
        run: python -c "import os, psycopg; psycopg.connect(os.environ['TEST_DATABASE_URL']).close()"
      - run: pytest backend/tests backend/unit_tests -q --junitxml=backend-test-results.xml -o junit_family=legacy
      - name: Report target-path benchmark
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for prop in ET.parse('backend-test-results.xml').iter('property'):
              if prop.get('name') == 'target_path_benchmark':
                  print('TARGET_PATH_BENCHMARK ' + prop.get('value'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend-test-results.xml
