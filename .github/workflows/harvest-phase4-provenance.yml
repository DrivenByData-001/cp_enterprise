name: harvest-phase4-provenance

on:
  push:
    branches:
      - chatgpt/harvest-phase4-provenance

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply provenance and methodology refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/market_data_processing.py')
          s = p.read_text()
          s = s.replace(
              'from datetime import datetime, timezone\n',
              'from datetime import datetime, timezone\nfrom typing import Literal\n',
              1,
          )
          marker = '''class DocumentNotProcessableError(MarketDataProcessingError):\n    pass\n\n\ndef source_quality_for_sample_size(sample_size: int | None) -> str:\n'''
          replacement = '''class DocumentNotProcessableError(MarketDataProcessingError):\n    pass\n\n\nReportSourceType = Literal["respondent_survey", "recruiter_benchmark", "market_report"]\n\n\nclass MarketSurveyExtractionEnvelope(MarketSurveyExtractionResult):\n    """Extraction output plus report-level methodology metadata.\n\n    `report_source_type` describes the report's stated methodology as a whole.\n    It is kept on the extraction run and never becomes a competing observation\n    schema field; row-level `source_kind` remains the durable observation fact.\n    """\n\n    report_source_type: ReportSourceType | None = None\n\n\ndef source_quality_for_sample_size(sample_size: int | None) -> str:\n'''
          if marker not in s:
              raise SystemExit('market_data_processing class marker not found')
          s = s.replace(marker, replacement, 1)

          old = '''def source_quality_for_sample_size(sample_size: int | None) -> str:\n    if sample_size is None:\n        return "document_linked_unknown_sample"\n'''
          new = '''def source_quality_for_sample_size(sample_size: int | None) -> str:\n    """Classify evidence strength without claiming statistical validation.\n\n    This label records whether row-level sample evidence was published. It is\n    not a consensus score, a provider rating, or proof that a benchmark is\n    representative of the market. Curator review remains a separate gate.\n    """\n    if sample_size is None:\n        return "document_linked_unknown_sample"\n'''
          if old not in s:
              raise SystemExit('source quality helper marker not found')
          s = s.replace(old, new, 1)

          old = 'def _persist_draft_observations(document_id: str, run_id: str, items, ai_run, source_date) -> dict:\n'
          new = 'def _persist_draft_observations(document_id: str, run_id: str, items, ai_run, source_date, report_source_type=None, methodology_notes=None) -> dict:\n'
          if old not in s:
              raise SystemExit('persist signature not found')
          s = s.replace(old, new, 1)

          old = '''                to_json_param({"items_extracted": len(items), "items_created": created, "items_skipped_incomplete": skipped_incomplete}),\n'''
          new = '''                to_json_param({\n                    "items_extracted": len(items),\n                    "items_created": created,\n                    "items_skipped_incomplete": skipped_incomplete,\n                    "report_source_type": report_source_type,\n                    "methodology_notes": methodology_notes,\n                }),\n'''
          if old not in s:
              raise SystemExit('output payload marker not found')
          s = s.replace(old, new, 1)

          old = '            task=TASK, prompt_name=PROMPT_NAME, user_input=document["content_text"], output_model=MarketSurveyExtractionResult,\n'
          new = '            task=TASK, prompt_name=PROMPT_NAME, user_input=document["content_text"], output_model=MarketSurveyExtractionEnvelope,\n'
          if old not in s:
              raise SystemExit('output model marker not found')
          s = s.replace(old, new, 1)

          old = '''        persisted = _persist_draft_observations(document_id, run_id, ai_result.output.items, ai_result.run, document["source_date"])\n'''
          new = '''        persisted = _persist_draft_observations(\n            document_id,\n            run_id,\n            ai_result.output.items,\n            ai_result.run,\n            document["source_date"],\n            getattr(ai_result.output, "report_source_type", None),\n            ai_result.output.methodology_notes,\n        )\n'''
          if old not in s:
              raise SystemExit('persist call marker not found')
          s = s.replace(old, new, 1)

          old = '''        "items_skipped_incomplete": persisted["skipped_incomplete"],\n        "model": ai_result.run.model,\n'''
          new = '''        "items_skipped_incomplete": persisted["skipped_incomplete"],\n        "report_source_type": getattr(ai_result.output, "report_source_type", None),\n        "methodology_notes": ai_result.output.methodology_notes,\n        "model": ai_result.run.model,\n'''
          if old not in s:
              raise SystemExit('process return marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('prompts/extract_market_survey.md')
          s = p.read_text()
          anchor = '''5. Be consistent and deterministic in structure and naming.\n\n## Field-by-field guidance\n'''
          block = '''5. Be consistent and deterministic in structure and naming.\n\n## Report-level methodology\n\nSet `report_source_type` once for the report, and only from methodology or\nprovenance that the report itself states:\n\n- `respondent_survey` — compensation statistics derived from survey\n  respondents or participants;\n- `recruiter_benchmark` — salary ranges or benchmarks based on placements,\n  candidate offers, mandate books, or direct recruiter market conversations;\n- `market_report` — compensation evidence is present but the stated\n  methodology does not support either more specific classification.\n\nIf the methodology is mixed or unclear, use `null`. This is provenance\nmetadata, not a source-quality score or a claim of statistical validation.\nIt is retained on the extraction run; it does not replace row-level\n`source_kind`.\n\n## Field-by-field guidance\n'''
          if anchor not in s:
              raise SystemExit('prompt methodology anchor not found')
          s = s.replace(anchor, block, 1)

          old = '''- `source_kind`: classify each row only when the report's methodology supports it: `respondent_survey` for respondent/participant statistics, `recruiter_benchmark` for placement/offer/mandate-book/direct-market ranges, or `other` when compensation evidence is present but neither specific class is supported. Leave null if unclear; never infer quality from the publisher's brand.\n'''
          new = '''- `source_kind`: classify the row only when the evidence behind that row supports it: `respondent_survey` for respondent/participant statistics, `recruiter_benchmark` for placement/offer/mandate-book/direct-market ranges, or `other` when compensation evidence is present but neither specific class is supported. If one clearly stated report-wide methodology applies uniformly to all compensation rows, the same classification may be repeated on those rows. If the report mixes evidence types, classify each row separately or leave it null. Never infer quality from the publisher's brand.\n'''
          if old not in s:
              raise SystemExit('source_kind prompt marker not found')
          s = s.replace(old, new, 1)

          old = '''- `reported_sample_size`: only when the report explicitly states how many\n  respondents/data points a figure is based on. Never estimate this from\n  phrases like "based on our extensive network" — that is not a number.\n'''
          new = '''- `reported_sample_size`: only when the report explicitly states how many\n  respondents/data points the row or figure is based on. An overall report\n  sample must not be copied into every row unless the source explicitly says\n  that whole sample underlies that row. Never estimate a row count from phrases\n  like "based on our extensive network" — that is not a number.\n'''
          if old not in s:
              raise SystemExit('sample-size prompt marker not found')
          s = s.replace(old, new, 1)

          old = '''  "methodology_notes": "string or null"\n}\n```\n'''
          new = '''  "methodology_notes": "string or null",\n  "report_source_type": "respondent_survey | recruiter_benchmark | market_report or null"\n}\n```\n'''
          if old not in s:
              raise SystemExit('prompt schema marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('backend/tests/test_market_data_refinement.py')
          s = p.read_text()
          s = s.replace(
              'from app.models import MarketSurveyExtractionItem, MarketSurveyExtractionResult\n',
              'from app.models import MarketSurveyExtractionItem\n',
              1,
          )
          old = '''def _fake_result(items):\n    output = MarketSurveyExtractionResult(items=[MarketSurveyExtractionItem(**item) for item in items])\n'''
          new = '''def _fake_result(items, *, report_source_type=None, methodology_notes=None):\n    output = mdp.MarketSurveyExtractionEnvelope(\n        items=[MarketSurveyExtractionItem(**item) for item in items],\n        report_source_type=report_source_type,\n        methodology_notes=methodology_notes,\n    )\n'''
          if old not in s:
              raise SystemExit('test fake result marker not found')
          s = s.replace(old, new, 1)

          test = '''\n\ndef test_report_methodology_is_preserved_as_extraction_metadata(client, monkeypatch):\n    doc = client.post(\n        "/api/market-data/documents/ingest",\n        json={\n            "text": "Cavehill representative recruiter benchmark",\n            "publisher": "Cavehill Consulting Group",\n            "report_title": "H1 2026 Review",\n            "report_date": "2026-06-30",\n        },\n    ).json()\n    monkeypatch.setattr(\n        mdp,\n        "run_json_task",\n        lambda **kw: _fake_result(\n            [{\n                "raw_role_label": "Actuarial Manager (Capital / Reporting)",\n                "geography": "Dublin",\n                "domain_or_practice_area": "Life",\n                "source_kind": "recruiter_benchmark",\n                "component": "base",\n                "pay_period": "annual",\n                "currency": "EUR",\n                "amount_min": 92000,\n                "amount_max": 128000,\n            }],\n            report_source_type="recruiter_benchmark",\n            methodology_notes="Placement evidence, candidate offers and direct market conversations.",\n        ),\n    )\n\n    response = client.post(f"/api/market-data/documents/{doc['id']}/extract")\n    assert response.status_code == 200\n    body = response.json()\n    assert body["report_source_type"] == "recruiter_benchmark"\n    assert "Placement evidence" in body["methodology_notes"]\n\n    detail = client.get(f"/api/market-data/documents/{doc['id']}").json()\n    payload = detail["extraction_runs"][0]["output_payload"]\n    assert payload["report_source_type"] == "recruiter_benchmark"\n    assert "candidate offers" in payload["methodology_notes"]\n    assert detail["observations"][0]["source_kind"] == "recruiter_benchmark"\n    assert "report_source_type" not in detail["observations"][0]\n\n\ndef test_market_survey_prompt_forbids_copying_overall_sample_to_each_row():\n    prompt = mdp.load_prompt(mdp.PROMPT_NAME)\n    assert "overall report" in prompt\n    assert "must not be copied into every row" in prompt\n    assert "not a source-quality score or a claim of statistical validation" in prompt\n'''
          if 'test_report_methodology_is_preserved_as_extraction_metadata' not in s:
              s += test
          p.write_text(s)
          PY
          rm .github/workflows/harvest-phase4-provenance.yml

      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Backend tests
        run: cd backend && pytest -q
      - name: Frontend checks
        run: cd frontend && npm ci && npm run lint && npm run build
      - name: Commit harvested refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Phase 4 report methodology provenance"
          git push origin HEAD:chatgpt/harvest-phase4-provenance
